name: PatientPing
description: 'PatientPing is a real-time care-coordination network that delivers e-notifications
  ("Pings") and ADT-based admission, discharge, and transfer alerts across hospitals, post-acute
  facilities, health plans, pharmacies, and community providers. Its Route solution helps hospitals
  meet the CMS Interoperability and Patient Access Rule e-notifications Condition of Participation.
  PatientPing was acquired by Appriss Health in 2021 and rebranded as Bamboo Health; patientping.com
  now redirects to bamboohealth.com. No public developer portal or API documentation is published —
  clinical integration is handled privately via HL7/ADT data feeds embedded in provider workflow.'
